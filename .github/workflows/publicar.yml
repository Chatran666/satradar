# Al subir una etiqueta vX.Y.Z, GitHub arma el instalador en Windows y lo publica en Releases
# junto con latest.json (que la app consulta para saber si hay versión nueva).
name: Publicar versión
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Versión desde la etiqueta
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Dependencias
        run: npm ci --no-audit --no-fund
      - name: Armar la app
        shell: bash
        run: >
          npx electron-packager . SatRadar --platform=win32 --arch=x64 --electron-version=33.2.1
          --icon=app/icono.ico --out=dist --overwrite --app-version=$VERSION --app-copyright=Mariano
          --win32metadata.CompanyName=Mariano --win32metadata.FileDescription=SatRadar --win32metadata.ProductName=SatRadar
          --ignore="^/app/datos-prueba" --ignore="^/build" --ignore="^/dist" --ignore="^/\.github"
          --ignore="^/node_modules/(electron-builder|app-builder|@electron/packager|dmg|7zip)"
      - name: Instalar NSIS
        run: choco install nsis -y --no-progress
      - name: Armar el instalador
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 "/DVERSION=$env:VERSION" build\instalador.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $repo = "${{ github.repository }}"
          @{ version = $env:VERSION; url = "https://github.com/$repo/releases/download/v$env:VERSION/SatRadar-Setup-$env:VERSION.exe"; notas = "" } |
            ConvertTo-Json | Set-Content -Encoding utf8 dist\latest.json
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          name: SatRadar ${{ env.VERSION }}
          files: |
            dist/SatRadar-Setup-${{ env.VERSION }}.exe
            dist/latest.json
