# Cuando cambia la versión en package.json (rama main), GitHub arma el instalador en Windows
# y lo publica en Releases junto con latest.json (que la app consulta para saber si hay versión nueva).
name: Publicar versión
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/publicar.yml', 'build/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Versión desde package.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSION=$V" >> $GITHUB_ENV
          if gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "YA_EXISTE=1" >> $GITHUB_ENV
            echo "La versión v$V ya está publicada; no hay nada que hacer."
          fi
      - name: Probar detección de ubicación
        continue-on-error: true
        run: node build/probar-ubicacion.js
      - name: Dependencias
        if: env.YA_EXISTE != '1'
        run: npm ci --no-audit --no-fund
      - name: Armar la app
        if: env.YA_EXISTE != '1'
        shell: bash
        run: >
          npx electron-packager . SatRadar --platform=win32 --arch=x64 --electron-version=33.2.1
          --icon=app/icono.ico --out=dist --overwrite --app-version=$VERSION --app-copyright=Mariano
          --win32metadata.CompanyName=Mariano --win32metadata.FileDescription=SatRadar --win32metadata.ProductName=SatRadar
          --ignore="^/app/datos-prueba" --ignore="^/build" --ignore="^/dist" --ignore="^/\.github"
          --ignore="^/node_modules/(electron-builder|app-builder|@electron/packager|dmg|7zip)"
      - name: Instalar NSIS
        if: env.YA_EXISTE != '1'
        run: choco install nsis -y --no-progress
      - name: Armar el instalador
        if: env.YA_EXISTE != '1'
        shell: pwsh
        run: |
          $raiz = (Get-Location).Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 "/DVERSION=$env:VERSION" "/DORIGEN=$raiz\dist\SatRadar-win32-x64" "/DSALIDA=$raiz\dist\SatRadar-Setup-$env:VERSION.exe" "/DICONO=$raiz\app\icono.ico" build\instalador.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $repo = "${{ github.repository }}"
          @{ version = $env:VERSION; url = "https://github.com/$repo/releases/download/v$env:VERSION/SatRadar-Setup-$env:VERSION.exe"; notas = "" } |
            ConvertTo-Json | Set-Content -Encoding utf8 dist\latest.json
      - name: Publicar
        if: env.YA_EXISTE != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: SatRadar ${{ env.VERSION }}
          files: |
            dist/SatRadar-Setup-${{ env.VERSION }}.exe
            dist/latest.json
